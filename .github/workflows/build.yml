name: Build iOS dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Build dylib
        run: |
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: CoccocAI-dylib
          path: libCoccocAI.dylib
